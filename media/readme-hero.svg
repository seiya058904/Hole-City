<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title description">
<title id="title">Hole City — swallow the world</title>
<desc id="description">Original illustrative cover: low-poly city buildings, a luminous circular hole, flowing debris, and arcade typography. This is not a gameplay screenshot.</desc>
<defs>
<linearGradient id="sky" x2="1" y2="1"><stop stop-color="#161A38"/><stop offset=".56" stop-color="#302B68"/><stop offset="1" stop-color="#19596A"/></linearGradient>
<radialGradient id="aura"><stop stop-color="#F070C8" stop-opacity=".4"/><stop offset=".65" stop-color="#8062FF" stop-opacity=".12"/><stop offset="1" stop-color="#8062FF" stop-opacity="0"/></radialGradient>
<linearGradient id="rim"><stop stop-color="#64F6DB"/><stop offset=".55" stop-color="#FF80CF"/><stop offset="1" stop-color="#8F8AFF"/></linearGradient>
<linearGradient id="letters"><stop stop-color="#77F9E3"/><stop offset="1" stop-color="#70BFFD"/></linearGradient>
<pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#FFF" opacity=".1"/></pattern>
<filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
